esphome:
  name: presence-sensor
  friendly_name: "Presence Sensor"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: DEBUG

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false

bluetooth_proxy:
  active: true

binary_sensor:
  - platform: gpio
    name: "PIR Motion"
    id: pir_motion
    pin:
      number: GPIO4
      mode:
        input: true
    device_class: motion
    filters:
      - delayed_on: 100ms
      - delayed_off: 5s

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
