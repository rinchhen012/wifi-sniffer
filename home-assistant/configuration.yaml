# Home Assistant configuration
# Set your location/timezone via Settings > System > General (UI writes here).

# Required for the companion app (presence tracking + push notifications)
mobile_app:

# Reverse proxy support (Tailscale Serve provides HTTPS for the app)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 192.168.97.1

automation: !include automations.yaml
template: !include template.yaml
input_boolean: !include input_boolean.yaml
input_text: !include input_text.yaml
mqtt: !include mqtt.yaml
notify: !include notify.yaml
